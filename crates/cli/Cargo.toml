[package]
name = "pharmakon-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "pharmakon"
path = "src/main.rs"

[dependencies]
pharmakon-common.workspace = true
pharmakon-core.workspace = true
pharmakon-gateway.workspace = true
pharmakon-channels.workspace = true
pharmakon-tools.workspace = true
pharmakon-memory.workspace = true
pharmakon-gui = { path = "../gui" }
anyhow.workspace = true
tokio.workspace = true
clap.workspace = true
env_logger.workspace = true
daemonize = "0.5"
log.workspace = true
dirs.workspace = true
dialoguer = "0.11"
ratatui = "0.29.0"
crossterm = { version = "0.28.1", features = ["event-stream"] }
tokio-tungstenite = "0.26.2"
futures-util = "0.3.32"
serde.workspace = true
serde_json.workspace = true
rust-i18n.workspace = true
