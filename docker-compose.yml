version: '3.8'

services:
  gateway:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "19999:19999"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - ~/.pharmakon:/root/.pharmakon
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ~/.pharmakon/qdrant:/qdrant/storage
